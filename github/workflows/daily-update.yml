name: Daily Update & Dashboard

on:
  schedule:
    - cron: '0 8 * * *'      # 8:00 UTC every day (before US open)
  workflow_dispatch:          # allows manual run from Actions tab

permissions:
  contents: write             # allow push back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy pandas-datareader

      - name: Fetch latest data and update CSVs
        run: python update_data.py

      - name: Generate daily dashboard
        run: python generate_report.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ pool_balance.txt
          git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d')"
          git push
